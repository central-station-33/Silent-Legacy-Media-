# Builds the Next.js app in web/ across supported Node versions.
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs

name: Node.js CI

on:
  push:
    branches: [ "claude/silent-legacy-launch-gvn3z1" ]
  pull_request:
    branches: [ "claude/silent-legacy-launch-gvn3z1" ]

jobs:
  build:

    runs-on: ubuntu-latest

    # The Node project lives in web/, not at the repository root.
    defaults:
      run:
        working-directory: web

    strategy:
      matrix:
        node-version: [20.x, 22.x]
        # See supported Node.js release schedule at https://nodejs.org/en/about/releases/

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
        cache-dependency-path: web/package-lock.json
    - run: npm ci
    # `next build` type-checks and lints as part of the build, so it is the
    # only check needed here. There is no test suite yet; add `npm test` back
    # once web/package.json defines a test script.
    - run: npm run build
